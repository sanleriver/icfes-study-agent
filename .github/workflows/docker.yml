# CI/CD — Build y push monolito Flet a GHCR + tests
# Uso local: docker compose up --build  (puerto 8000, http://localhost:8000)
#           docker compose --profile tests run --rm tests
# En CI: buildx + cache GHA, push a ghcr.io/<owner>/<repo> si hay permisos

name: docker

on:
  push:
    branches: [main, master]
    paths:
      - "flet_app/**"
      - "src/**"
      - "data/**"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "flet_app/**"
      - "src/**"
      - "data/**"
      - "requirements.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q
        env:
          FEEDBACK_PROVIDER: mock

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (no push on PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image (PR only — no push)
        if: github.event_name == 'pull_request'
        run: |
          docker build -f Dockerfile -t tutor-icfes:test .
          docker run --rm -d -p 8000:8000 --name tutor-test tutor-icfes:test
          echo "Waiting for Flet web on 8000..."
          for i in 1 2 3 4 5 6 7 8; do
            if wget -qO- http://127.0.0.1:8000/ > /dev/null; then echo "smoke ok (attempt $i)"; break; fi
            echo "  attempt $i failed, retry in 5s..."
            sleep 5
          done
          wget -qO- http://127.0.0.1:8000/ | head -n 30 || true
          docker logs tutor-test 2>&1 | tail -n 50 || true
          docker rm -f tutor-test
